services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blink_user
      POSTGRES_PASSWORD: blink_pass
      POSTGRES_DB: blink_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blink_user -d blink_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://blink_user:blink_pass@postgres:5432/blink_db
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - '5000:5000'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
